name: fuzz

on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [request_head, response_head]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1
      - name: Fuzz public API with AddressSanitizer
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "tmp/fuzz/$FUZZ_TARGET"
          cargo fuzz run --sanitizer address "$FUZZ_TARGET" \
            "tmp/fuzz/$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET" -- \
            -max_total_time=300 -max_len=4096
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
