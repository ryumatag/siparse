# Modeled on jiff's publish workflow (jiff/.github/workflows/publish.yml).
#
# Pushing a version tag such as `0.1.0` publishes the crate to crates.io
# through Trusted Publishing. crates.io must list this repository, this
# workflow file, and the `publish` environment as a trusted publisher.
name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Allows retrying a failed publish without moving the tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # Catches a tag pushed before the version bump was committed.
      - name: Check that the tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "siparse") | .version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version."
            exit 1
          fi
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
