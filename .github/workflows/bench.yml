name: bench

# Pull requests compare against their base, and a push to an `rt/` branch
# against where it left `main`. `ci` only runs on pull requests, so an
# optimization branch can be measured on every push before it has one. A
# squash merge lands the same tree on `main`, so a push there is not
# benchmarked again. A release tag compares against the release before it.
#
# Trailers in the head commit message adjust a branch or pull request run:
#
#   Bench-Filter: ^parse/header_value/   benchmarks to run instead of FILTER
#   Bench-Base: HEAD~1                   base revision, relative to the head
#   Bench-Targets: aarch64 x86_64        targets to run, or `all`
#
# `Bench-Base: HEAD~1` compares one attempt against the previous one.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
  push:
    branches:
      - 'rt/**'
    paths:
      - 'src/**'
      - 'bench/**'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

# A newer push to the same branch makes an in-flight comparison stale. A
# push and the pull request for it share the branch name, so only the later
# of the two runs.
concurrency:
  group: bench-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Reads the trailers and picks the targets, so the matrix can depend on
  # them.
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      filter: ${{ steps.plan.outputs.filter }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A pull request checks out a merge commit, but the trailers are
          # on the branch tip.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Read the trailers
        id: plan
        run: |
          # The targets a SIMD path must serve. `default` marks the ones run
          # without `Bench-Targets`.
          #
          # - x86_64: the default build, which only assumes SSE2. A SIMD path
          #   that needs more has to detect it at run time to run here.
          # - x86_64-native: the same runner, built for its own CPU. The
          #   difference against the default build is what run-time
          #   detection costs or misses. The CPU differs between runners,
          #   but base and head share one.
          # - aarch64: NEON is part of the aarch64 baseline, so one build is
          #   enough.
          # - aarch64-apple: an Apple core. Its runners moved by up to 12%
          #   between identical builds, so it only runs on request.
          all='[
            {"name": "x86_64", "os": "ubuntu-latest", "default": true},
            {"name": "x86_64-native", "os": "ubuntu-latest",
             "rustflags": "-C target-cpu=native", "default": true},
            {"name": "aarch64", "os": "ubuntu-24.04-arm", "default": true},
            {"name": "aarch64-apple", "os": "macos-latest", "default": false}
          ]'

          trailer() {
            if [[ "$GITHUB_REF_TYPE" != tag ]]; then
              git log -1 --format="%(trailers:key=$1,valueonly)" | head -n 1
            fi
          }

          requested=$(trailer Bench-Targets)
          if [[ -z "$requested" ]]; then
            targets=$(jq -c 'map(select(.default))' <<< "$all")
          elif [[ "$requested" == all ]]; then
            targets=$(jq -c . <<< "$all")
          else
            names=$(jq -Rc '[splits("[, ]+") | select(. != "")]' <<< "$requested")
            unknown=$(jq -r --argjson all "$all" \
              '. - ($all | map(.name)) | join(" ")' <<< "$names")
            if [[ -n "$unknown" ]]; then
              echo "::error::Unknown Bench-Targets: $unknown"
              exit 1
            fi
            targets=$(jq -c --argjson names "$names" \
              'map(select(.name | IN($names[])))' <<< "$all")
          fi

          {
            echo "targets=$targets"
            echo "filter=$(trailer Bench-Filter)"
            echo "base=$(trailer Bench-Base)"
          } >> "$GITHUB_OUTPUT"

  # Compares the head benchmarks against a base commit. Shared runners are
  # noisy, so the result is informational and never fails the job. Clippy
  # and the benchmark assertions run in `ci`.
  #
  # One job per CPU target, so a change that helps one architecture and
  # hurts another shows up. The header value scan and `find_head_end` have
  # SSE2 and NEON paths, and the other scans are SWAR on every target.
  compare:
    name: compare (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      TARGET: ${{ matrix.name }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The public head benchmarks are the ones used for decisions. Running
      # the whole suite twice would take far longer.
      FILTER: ${{ needs.plan.outputs.filter || '^parse/(request|response)_head/' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The base commit and the earlier release tags.
          fetch-depth: 0
          fetch-tags: true
      - name: Pick the base commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED: ${{ needs.plan.outputs.base }}
        run: |
          # A pull request checks out a merge commit, so its head is the
          # branch tip instead.
          head="${PR_HEAD_SHA:-$GITHUB_SHA}"

          if [[ -n "$REQUESTED" ]]; then
            # `HEAD` names the head commit, not the merge commit.
            base=$(git rev-parse --verify "${REQUESTED/#HEAD/$head}^{commit}")
            label="$REQUESTED ($base)"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            label="$base"
          elif [[ "$GITHUB_REF_TYPE" == branch ]]; then
            base=$(git merge-base origin/main "$head")
            label="main ($base)"
          else
            # The highest release below this tag. Only `x.y.z` tags count
            # as a base, so a pre-release never is one.
            previous=$(
              {
                git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
                echo "$GITHUB_REF_NAME"
              } | sort -uV | awk -v tag="$GITHUB_REF_NAME" \
                '$0 == tag { print prev; exit } { prev = $0 }'
            )
            if [[ -z "$previous" ]]; then
              echo "No release before $GITHUB_REF_NAME. Skipping."
              exit 0
            fi
            base=$(git rev-parse "$previous^{commit}")
            label="$previous"
          fi
          {
            echo "BASE_SHA=$base"
            echo "BASE_LABEL=$label"
          } >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install critcmp
        run: cargo install --locked critcmp
      # `bench/target` is ignored by Git, so the saved baseline survives
      # the checkouts below.
      - name: Benchmark the base commit
        id: base
        run: |
          # A first release has no base, and an old base may predate the
          # benchmark crate.
          if [[ -z "$BASE_SHA" ]]; then
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:bench/Cargo.toml" 2>/dev/null; then
            echo "No benchmarks at base commit $BASE_SHA. Skipping."
            exit 0
          fi
          git checkout --detach "$BASE_SHA"
          (cd bench && cargo bench -- "$FILTER" --save-baseline base)
          git checkout --detach "$GITHUB_SHA"
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: Benchmark the head commit
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        run: cargo bench -- "$FILTER" --save-baseline head
      - name: Compare
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        # `-t 5` alone prints nothing useful when no benchmark moved by 5%
        # or more, so print the full table first. The summary shows the
        # same tables on the run page.
        run: |
          {
            echo "## Benchmarks on $TARGET against $BASE_LABEL"
            echo
            echo "Filter: \`$FILTER\`"
            echo
            echo '```'
            critcmp base head
            echo '```'
            echo
            echo "Changes of 5% or more:"
            echo
            echo '```'
            critcmp -t 5 base head || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The baselines as JSON, so the targets can be compared side by side
      # with `critcmp` after `gh run download`.
      - name: Export the baselines
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        run: |
          mkdir -p ../bench-results
          for baseline in base head; do
            out="../bench-results/$TARGET-$baseline.json"
            # The base has no baseline when none of the filtered benchmarks
            # existed there yet, such as benchmarks added on this branch.
            if ! critcmp --export "$baseline" > "$out"; then
              echo "No $baseline baseline to export."
              rm "$out"
            fi
          done
      - name: Upload the baselines
        if: steps.base.outputs.ran == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}
          path: bench-results/
