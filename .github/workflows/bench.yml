name: bench

# Pull requests compare against their base, and a push to an `rt/` branch
# against where it left `main`. `ci` only runs on pull requests, so an
# optimization branch can be measured on every push before it has one. A
# squash merge lands the same tree on `main`, so a push there is not
# benchmarked again. A release tag compares against the release before it.
#
# Trailers in the head commit message adjust a branch or pull request run:
#
#   Bench-Filter: ^parse/header_value/   benchmarks to run instead of FILTER
#   Bench-Base: HEAD~1                   base revision, relative to the head
#
# `Bench-Base: HEAD~1` compares one attempt against the previous one.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
  push:
    branches:
      - 'rt/**'
    paths:
      - 'src/**'
      - 'bench/**'
      - 'Cargo.toml'
      - '.github/workflows/bench.yml'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

# A newer push to the same branch makes an in-flight comparison stale. A
# push and the pull request for it share the branch name, so only the later
# of the two runs.
concurrency:
  group: bench-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Compares the head benchmarks against a base commit. Shared runners are
  # noisy, so the result is informational and never fails the job. Clippy
  # and the benchmark assertions run in `ci`.
  #
  # One job per CPU target, so a change that helps one architecture and
  # hurts another shows up. The delimiter scans are SWAR today, and SIMD
  # paths for x86_64 and aarch64 are planned.
  compare:
    name: compare (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default x86_64 build, which only assumes SSE2. A SIMD path
          # that needs more has to detect it at run time to run here.
          - name: x86_64
            os: ubuntu-latest
          # The same runner, built for its own CPU. The difference against
          # the default build is what run-time detection costs or misses.
          # The CPU differs between runners, but base and head share one.
          - name: x86_64-native
            os: ubuntu-latest
            rustflags: -C target-cpu=native
          # NEON is part of the aarch64 baseline, so one build is enough.
          - name: aarch64
            os: ubuntu-24.04-arm
          - name: aarch64-apple
            os: macos-latest
    env:
      TARGET: ${{ matrix.name }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The public head benchmarks are the ones used for decisions. Running
      # the whole suite twice would take far longer.
      FILTER: ^parse/(request|response)_head/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The base commit and the earlier release tags.
          fetch-depth: 0
          fetch-tags: true
      - name: Pick the base commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The head commit carries the trailers. A pull request checks out
          # a merge commit, so its head is the branch tip instead.
          head="${PR_HEAD_SHA:-$GITHUB_SHA}"
          trailer() {
            git log -1 --format="%(trailers:key=$1,valueonly)" "$head" |
              head -n 1
          }

          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            filter=$(trailer Bench-Filter)
            if [[ -n "$filter" ]]; then
              echo "FILTER=$filter" >> "$GITHUB_ENV"
            fi
            requested=$(trailer Bench-Base)
          fi

          if [[ -n "$requested" ]]; then
            # `HEAD` names the head commit, not the merge commit.
            base=$(git rev-parse --verify "${requested/#HEAD/$head}^{commit}")
            label="$requested ($base)"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            label="$base"
          elif [[ "$GITHUB_REF_TYPE" == branch ]]; then
            base=$(git merge-base origin/main "$head")
            label="main ($base)"
          else
            # The highest release below this tag. Only `x.y.z` tags count
            # as a base, so a pre-release never is one.
            previous=$(
              {
                git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
                echo "$GITHUB_REF_NAME"
              } | sort -uV | awk -v tag="$GITHUB_REF_NAME" \
                '$0 == tag { print prev; exit } { prev = $0 }'
            )
            if [[ -z "$previous" ]]; then
              echo "No release before $GITHUB_REF_NAME. Skipping."
              exit 0
            fi
            base=$(git rev-parse "$previous^{commit}")
            label="$previous"
          fi
          {
            echo "BASE_SHA=$base"
            echo "BASE_LABEL=$label"
          } >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install critcmp
        run: cargo install --locked critcmp
      # `bench/target` is ignored by Git, so the saved baseline survives
      # the checkouts below.
      - name: Benchmark the base commit
        id: base
        run: |
          # A first release has no base, and an old base may predate the
          # benchmark crate.
          if [[ -z "$BASE_SHA" ]]; then
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:bench/Cargo.toml" 2>/dev/null; then
            echo "No benchmarks at base commit $BASE_SHA. Skipping."
            exit 0
          fi
          git checkout --detach "$BASE_SHA"
          (cd bench && cargo bench -- "$FILTER" --save-baseline base)
          git checkout --detach "$GITHUB_SHA"
          echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: Benchmark the head commit
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        run: cargo bench -- "$FILTER" --save-baseline head
      - name: Compare
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        # `-t 5` alone prints nothing useful when no benchmark moved by 5%
        # or more, so print the full table first. The summary shows the
        # same tables on the run page.
        run: |
          {
            echo "## Benchmarks on $TARGET against $BASE_LABEL"
            echo
            echo "Filter: \`$FILTER\`"
            echo
            echo '```'
            critcmp base head
            echo '```'
            echo
            echo "Changes of 5% or more:"
            echo
            echo '```'
            critcmp -t 5 base head || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The baselines as JSON, so the targets can be compared side by side
      # with `critcmp` after `gh run download`.
      - name: Export the baselines
        if: steps.base.outputs.ran == 'true'
        working-directory: bench
        run: |
          mkdir -p ../bench-results
          critcmp --export base > "../bench-results/$TARGET-base.json"
          critcmp --export head > "../bench-results/$TARGET-head.json"
      - name: Upload the baselines
        if: steps.base.outputs.ran == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.name }}
          path: bench-results/
