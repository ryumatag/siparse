name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
          - build: beta
            os: ubuntu-latest
            rust: beta
          - build: nightly
            os: ubuntu-latest
            rust: nightly
          - build: windows
            os: windows-latest
            rust: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test
        run: cargo test --verbose

  test-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Run benchmark tests
        run: cargo bench --manifest-path bench/Cargo.toml -- --test

  test-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Test seeds and every complete head prefix
        run: cargo test --manifest-path fuzz/Cargo.toml --lib
      - name: Build fuzz targets with AddressSanitizer
        run: cargo fuzz build --sanitizer address

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path bench/Cargo.toml -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path bench/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.65"
      - name: Build
        run: cargo build --verbose

  no-std:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - name: Build for a target without std
        run: >-
          cargo build --verbose --lib --no-default-features
          --target thumbv7em-none-eabihf

  # Miri runs the tests of the modules whose `unsafe` it can check: the
  # header buffer and token marks in `parse`, and the cursor moves and block
  # loads in `scan` and `simd`. Those tests drive the cursor in `iter`, which
  # has none of its own. The other modules reach `unsafe` only through
  # these scans, and the only `unsafe` in `check` is `from_utf8_unchecked`,
  # whose UTF-8 Miri does not check. Their tests took longer than all the
  # other jobs here and could find nothing these miss. A module that gains
  # `unsafe` Miri can check joins the filter.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - name: Run tests under Miri
        run: >-
          cargo miri test --verbose --lib -- parse:: scan:: simd::
      # The runner is x86_64, so the step above checks the SSE2 paths. Miri
      # interprets other targets too, which reaches the NEON ones.
      - name: Run the NEON scans under Miri
        run: >-
          cargo miri test --verbose --lib --target aarch64-unknown-linux-gnu
          -- simd::

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Build docs
        run: cargo doc --no-deps --verbose
