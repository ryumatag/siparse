[package]
name = "siparse-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
siparse = { path = "..", default-features = false }

[[bin]]
name = "request_head"
path = "fuzz_targets/request_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_head"
path = "fuzz_targets/response_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "find_head_end"
path = "fuzz_targets/find_head_end.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "value"
path = "fuzz_targets/value.rs"
test = false
doc = false
bench = false
